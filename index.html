<body>
<style>
:root{
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-ui:"Fredoka","Nunito","Varela Round",system-ui,-apple-system,"Segoe UI",sans-serif;
  --p-ink:#6b3f22;--p-sub:#a87652;--p-bg1:#fffbf2;--p-bg2:#ffe9c9;--p-edge:#eaa95f;--p-edge-d:#b8732f;
  --sky1:#5a4ad6;--sky2:#1d1858;--glow:rgba(160,140,255,.6);--frame:#7e8cff;--frame-d:#4550d0;--frame-lip:#262c8c;--well:#191b4d;--cell:#272a6a;--ol:#1a1450;
  --bg-art:none;--bg-size:auto;
  color-scheme:light;
}
html,body{height:100%}
body{
  background-color:var(--sky2);
  background-image:var(--bg-art),radial-gradient(130% 85% at 50% 40%,transparent 55%,rgba(40,10,40,.16)),radial-gradient(60% 40% at 50% 46%,rgba(255,255,255,.28),transparent 70%),radial-gradient(80% 45% at 50% -6%,var(--glow),transparent 72%),linear-gradient(180deg,var(--sky1),var(--sky2));
  background-size:var(--bg-size),100% 100%,100% 100%,100% 100%,100% 100%;
  color:#fff;font-family:var(--font-ui);font-weight:600;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
/* soft bokeh lights over every sky */
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:
    radial-gradient(140px 140px at 6% 16%,rgba(255,255,255,.22),transparent 70%),
    radial-gradient(200px 200px at 96% 30%,rgba(255,255,255,.16),transparent 70%),
    radial-gradient(160px 160px at 14% 78%,rgba(255,255,255,.14),transparent 70%),
    radial-gradient(240px 240px at 88% 92%,rgba(255,255,255,.12),transparent 70%)}
.app{position:relative;box-sizing:border-box;height:100%;max-width:480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.screen{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6dvh,14px)}
#scrGame{justify-content:center;gap:clamp(10px,2.2dvh,20px)}
.col{width:min(100%,max(240px,calc(100vh - 318px)));width:min(100%,max(240px,calc(100dvh - 318px)))}

/* ---------- Outlined game text ---------- */
.ot{color:#fff;--ow:2px;text-shadow:
  var(--ow) 0 0 var(--ol),calc(var(--ow)*-1) 0 0 var(--ol),0 var(--ow) 0 var(--ol),0 calc(var(--ow)*-1) 0 var(--ol),
  calc(var(--ow)*.75) calc(var(--ow)*.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*.75) 0 var(--ol),
  calc(var(--ow)*.75) calc(var(--ow)*-.75) 0 var(--ol),calc(var(--ow)*-.75) calc(var(--ow)*-.75) 0 var(--ol),
  0 calc(var(--ow)*2) 0 var(--ol),var(--ow) calc(var(--ow)*2) 0 var(--ol),calc(var(--ow)*-1) calc(var(--ow)*2) 0 var(--ol),
  0 calc(var(--ow)*3) 6px rgba(0,0,0,.25)}
.ot.lg{--ow:3px}
.ot.xl{--ow:4px}

/* ---------- 3D candy buttons ---------- */
.gbtn{--b1:#8aea62;--b2:#45bb34;--b3:#2b8a20;--ol:#2a7a1e;
  position:relative;isolation:isolate;border:0;margin:0;cursor:pointer;border-radius:20px;padding:0 26px;height:58px;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  font:400 25px/1 var(--font-display);letter-spacing:.4px;color:#fff;
  background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 6px 0 var(--b3),0 12px 18px rgba(0,0,0,.22);
  transition:transform .07s ease-out,box-shadow .07s ease-out}
.gbtn::before{content:"";position:absolute;z-index:-1;left:7px;right:7px;top:4px;height:42%;border-radius:15px 15px 40% 40%/15px 15px 26% 26%;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.08))}
.gbtn:active{transform:translateY(5px);box-shadow:inset 0 -5px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 1px 0 var(--b3),0 3px 6px rgba(0,0,0,.22)}
.gbtn:focus-visible,.ibtn:focus-visible,.skin-card:focus-visible{outline:3px solid #fff;outline-offset:4px}
.gbtn.orange{--b1:#ffc65e;--b2:#ff8f1f;--b3:#c25e0a;--ol:#b0520a}
.gbtn.blue{--b1:#74d4ff;--b2:#2f8ff0;--b3:#1b5eb3;--ol:#1a55a1}
.gbtn.pink{--b1:#ffa2cf;--b2:#f2559b;--b3:#b02f6a;--ol:#a12a60}
.gbtn.purple{--b1:#c7a1ff;--b2:#8a5cf0;--b3:#5a34b3;--ol:#4f2fa3}
.gbtn.red{--b1:#ff8a8a;--b2:#e64545;--b3:#a62626;--ol:#962222}
.gbtn.cream{--b1:#fffaf0;--b2:#ffe8c8;--b3:#d8b585;color:var(--p-ink)}
.gbtn.cream::before{background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.2))}
.gbtn.cream span{text-shadow:0 2px 0 rgba(255,255,255,.8)}
.gbtn.sm{height:48px;font-size:21px;border-radius:16px;padding:0 20px}
.gbtn.wide{width:100%}
.gbtn svg{width:26px;height:26px;flex:none;filter:drop-shadow(0 2px 0 var(--ol))}

/* round icon button */
.ibtn{--b1:#74d4ff;--b2:#2f8ff0;--b3:#1b5eb3;--ol:#1a55a1;
  position:relative;isolation:isolate;flex:none;width:48px;height:48px;border:0;margin:0;padding:0;border-radius:16px;cursor:pointer;color:#fff;
  display:grid;place-items:center;background:linear-gradient(180deg,var(--b1),var(--b2));
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.13),inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 var(--b3),0 9px 14px rgba(0,0,0,.2);
  transition:transform .07s ease-out,box-shadow .07s ease-out}

.pop-score{position:absolute;transform:translate(-50%,-50%);font:400 30px/1 var(--font-display);--ol:#a35e05;color:#ffe46b;white-space:nowrap;animation:rise 1s ease-out forwards}
@keyframes rise{0%{opacity:0;scale:.4}18%{opacity:1;scale:1.25}32%{scale:1}100%{opacity:0;translate:0 -54px}}
.banner{position:absolute;left:50%;top:44%;translate:-50% -50%;white-space:nowrap;padding:22px 44px;border-radius:50%;background:radial-gradient(closest-side,rgba(40,10,30,.22),transparent);font:400 clamp(40px,11.5vw,54px)/1 var(--font-display);animation:bannerIn 1.35s cubic-bezier(.3,1.4,.5,1) forwards;color:#ffe46b;--ol:#8a3d00}

@keyframes bannerIn{0%{opacity:0;scale:.2;rotate:-8deg}16%{opacity:1;scale:1.18;rotate:3deg}28%{scale:1;rotate:0deg}78%{opacity:1;translate:-50% -50%}100%{opacity:0;translate:-50% -90%}}
.conf{position:absolute;top:-4%;width:10px;height:14px;border-radius:3px;animation:fall var(--t,1.6s) cubic-bezier(.3,.4,.6,1) var(--dl,0s) forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx,0),108vh) rotate(var(--rot,540deg))}}
/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;box-sizing:border-box;overflow:hidden;

.mpanel{position:relative;width:min(340px,100%);padding:50px 20px 24px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;

.mpanel .lbl{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--p-sub)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}
/*SKINS-START*/
/* ===== Skin engine v2 ===================================================
   Each block holds <i class="sk">. The block sets --c (--k1..--k9; 9 = stone)
   and data-k. Blocks are size containers, so decoration uses cqw units.
   Every style also sets its scene: --sky1/--sky2/--glow (background),
   --frame/--frame-d/--frame-lip (board frame), --well/--cell (board inside),
   --ol (outline colour for white game text on that background).
   ====================================================================== */
.cell,.blk{position:relative;container-type:size}
.sk{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  --l1:color-mix(in srgb,var(--c),#fff 24%);
  --l2:color-mix(in srgb,var(--c),#fff 50%);
  --l3:color-mix(in srgb,var(--c),#fff 74%);
  --d1:color-mix(in srgb,var(--c),#000 9%);
  --d2:color-mix(in srgb,var(--c),#000 20%);
  --d3:color-mix(in srgb,var(--c),#000 34%);
  --ob:color-mix(in srgb,var(--c),#2b1236 46%);
  --gloss:radial-gradient(74% 40% at 50% 7%,rgba(255,255,255,.82),rgba(255,255,255,0) 76%);
}
.cell:not(.f):not(.w):not(.g) .sk{display:none}
.cell.f,.cell.w{background:transparent!important;box-shadow:none!important}
.cell.g .sk{opacity:.5}
.cell .gs,.blk .gs{z-index:3}
.cell.w::before{z-index:2}
.cell.pop::after{z-index:4}
.cell.land .sk{animation:land .42s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{0%{scale:1.18 .82}50%{scale:.94 1.07}100%{scale:1 1}}
.tiny .sk::before,.tiny .sk::after{display:none!important}
.tiny .sk{inset:0!important;transform:none!important}
/* clean face-free tiles for the logo */
.plain .sk{inset:0!important;border-radius:26%!important;transform:none!important;filter:none!important;
  background:var(--gloss),linear-gradient(180deg,var(--l1),var(--c) 50%,var(--d2))!important;
  box-shadow:inset 0 -7cqw 3cqw var(--d2),inset 0 3cqw 0 rgba(255,255,255,.4),0 0 0 3cqw var(--ob),0 6cqw 6cqw rgba(0,0,0,.25)!important}
.plain .sk::before,.plain .sk::after{display:none!important}

/* ---------- Arcade ---------- */
[data-skin="classic"],[data-bg="classic"]{
  --sky1:#5a4ad6;--sky2:#1d1858;--glow:rgba(160,140,255,.6);--frame:#7e8cff;--frame-d:#4550d0;--frame-lip:#262c8c;--well:#191b4d;--cell:#272a6a;--ol:#1a1450;
  --k1:#ff4f5e;--k2:#ff9a2e;--k3:#ffd12e;--k4:#2fd58f;--k5:#2ec4f2;--k6:#4d7cff;--k7:#a35cff;--k8:#ff5fb8;--k9:#6d7299;
  --bg-art:radial-gradient(circle,rgba(255,255,255,.07) 0 2px,transparent 2.5px);--bg-size:26px 26px;--face:#2a1a3a;
}
[data-skin="classic"] .cell{border-radius:20%}
[data-skin="classic"] .sk{border-radius:22%;
  background:var(--gloss),linear-gradient(180deg,var(--l1),var(--c) 48%,var(--d2));
  box-shadow:inset 0 -6cqw 4cqw var(--d2),inset 0 0 0 2cqw rgba(255,255,255,.14),0 0 0 2.4cqw var(--ob),0 4cqw 3cqw rgba(0,0,0,.35)}
[data-skin="classic"] [data-k="9"] .sk{background:radial-gradient(70% 36% at 50% 8%,rgba(255,255,255,.25),transparent 75%),linear-gradient(180deg,#7d82a8,#6d7299 50%,#555a80)}

/* ---------- Gummy ---------- */
[data-skin="gummy"],[data-bg="gummy"]{
  --sky1:#ffd6ef;--sky2:#ff9fd1;--glow:rgba(255,255,255,.75);--frame:#ff86c8;--frame-d:#e8479b;--frame-lip:#ad2a70;--well:#fff2f9;--cell:#ffdcef;--ol:#a3246a;
  --k1:#ff3f5a;--k2:#ff8c3c;--k3:#ffc824;--k4:#6ed645;--k5:#22c9b5;--k6:#4a93ff;--k7:#9a63ff;--k8:#ff5fae;--k9:#8d7a8c;
  --bg-art:radial-gradient(circle,rgba(255,255,255,.18) 0 4px,transparent 4.5px);--bg-size:30px 30px;
}
[data-skin="gummy"] .cell{border-radius:36%}
[data-skin="gummy"] .sk{border-radius:36%;
  background:
    radial-gradient(90% 60% at 50% 108%,color-mix(in srgb,var(--c),#000 26%) 0%,transparent 70%),
    linear-gradient(165deg,color-mix(in srgb,var(--l2) 92%,transparent) 0%,color-mix(in srgb,var(--c) 90%,transparent) 46%,color-mix(in srgb,var(--d1) 95%,transparent) 100%);
  box-shadow:inset 0 0 0 3.5cqw color-mix(in srgb,var(--l2) 70%,transparent),inset 0 -9cqw 12cqw color-mix(in srgb,var(--c),#000 22%),0 0 0 2.2cqw var(--ob),0 5cqw 6cqw color-mix(in srgb,var(--c),transparent 55%)}

/* collectibles replace the old diamonds */
.gs{clip-path:none!important;background:var(--gi) center/contain no-repeat!important}
.cell .gs,.blk .gs{inset:13%!important;filter:drop-shadow(0 1.6cqw 0 rgba(0,0,0,.2))}
.cell.gem .gs{animation:itembob 2.4s ease-in-out infinite}
@keyframes itembob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3%) scale(1.06)}}
/* an item sitting on the board gets a cream item tile, like Block Crush */
.board .cell.f.gem[data-k="9"] .sk{inset:2%!important;border-radius:20%!important;transform:none!important;filter:none!important;
  background:linear-gradient(180deg,#fffbf3,#f6e3c2)!important;box-shadow:inset 0 -5cqw 0 #e0c08e,inset 0 3cqw 0 #fff,0 3cqw 3cqw rgba(0,0,0,.28)!important}
.board .cell.f.gem[data-k="9"] .sk::before,.board .cell.f.gem[data-k="9"] .sk::after{display:none!important}
/* a clean grid instead of hollow slots */
.board{gap:2px!important;padding:5px!important}
:is(.board,.skin-board) .cell:not(.f):not(.w){border-radius:8%!important;background:var(--cell)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(0,0,0,.1)!important}
/* pieces sit straight on the background */

<script>
(() => {
const COLORS = [0,1,2,3,4,5,6,7];
let colorCache = {};
function realColor(slot){ if (!colorCache[slot]) colorCache[slot] = getComputedStyle(document.getElementById('scrGame')).getPropertyValue(`--k${slot+1}`).trim() || '#ff7ab0'; return colorCache[slot]; }
const SKINS = [
  {id:'pic-velvet',name:'Velvet Plush',group:'pic',isNew:1},{id:'pic-fur',name:'Fluffy Fur',group:'pic',isNew:1},{id:'pic-picnic',name:'Picnic Fleece',group:'pic',isNew:1},{id:'pic-charms',name:'Ceramic Charms',group:'pic',isNew:1},{id:'pic-knit',name:'Cozy Knit',group:'pic',isNew:1},{id:'pic-cotton',name:'Cotton Candy',group:'pic',isNew:1},{id:'pic-jelly',name:'Jelly Candy',group:'pic',isNew:1},{id:'pic-glaze',name:'Glazed Ceramic',group:'pic',isNew:1},{id:'pic-sweater',name:'Knit Sweater',group:'pic',isNew:1},{id:'pic-fluff',name:'Cotton Fluff',group:'pic',isNew:1},{id:'pic-felt',name:'Soft Felt',group:'pic',isNew:1},{id:'pic-ceramics',name:'Ceramic Collection',group:'pic',isNew:1},{id:'pic-knits',name:'Knit Collection',group:'pic',isNew:1},{id:'pic-clouds',name:'Cloud Candy',group:'pic',isNew:1},{id:'pic-animals',name:'Animal Pals',group:'pic'},{id:'pic-sweets',name:'Sweet Treats',group:'pic'},{id:'pic-fruits',name:'Fruit Buddies',group:'pic'},{id:'pic-sky',name:'Sky Friends',group:'pic'},{id:'pic-party',name:'Kawaii Party',group:'pic'},{id:'pic-grass',name:'Lush Grass',group:'pic'},{id:'pic-jade',name:'Crystal Jade',group:'pic'},{id:'pic-sugar',name:'Sugar Crystal',group:'pic'},{id:'pic-wood',name:'Woodland',group:'pic'},{id:'pic-gems',name:'Candy Gems',group:'pic'},{id:'pic-crackers',name:'Butter Crackers',group:'pic'},{id:'pic-toast',name:'Toasty',group:'pic'},{id:'pic-waffles',name:'Waffles',group:'pic'},{id:'pic-cookies',name:'Sprinkle Cookies',group:'pic'},{id:'pic-bakery',name:'Sweet Bakery',group:'pic'},
  {id:'kawaii',name:'Kawaii'},{id:'meadow',name:'Meadow'},{id:'gummy',name:'Gummy'},{id:'kitty',name:'Kitty'},
  {id:'jade',name:'Jade Glass'},{id:'macaron',name:'Macaron'},{id:'toast',name:'Toast'},{id:'mochi',name:'Mochi'},
  {id:'sticker',name:'Stickers'},{id:'cracker',name:'Crackers'},{id:'plush',name:'Plushie Pals'},{id:'blossom',name:'Blossom'},

];
const K_SKIN='bloomsort:skin';
let skin = (()=>{ try{ return localStorage.getItem(K_SKIN); }catch(e){ return null; } })();
if (!SKINS.some(x=>x.id===skin)) skin='pic-party';
// Slots that look alike count as one kind: picture styles with 4 tiles repeat them across the 8 slots.
let same = [0,1,2,3,4,5,6,7], kindSlots = [0,1,2,3,4,5,6,7];
function applySkin(){
  document.body.dataset.bg=skin; for (const id of ['scrHome','scrGame']) document.getElementById(id).dataset.skin=skin; colorCache={};
  const cs=getComputedStyle(document.getElementById('scrGame')), seen={};
  same = COLORS.map(c=>{ const v=(cs.getPropertyValue(`--k${c+1}`).trim()+'|'+tileKey(c)); return seen[v]??(seen[v]=c); });
  kindSlots = [...new Set(same)];
}
function tileKey(c){ const probe=document.createElement('div'); probe.className='blk'; probe.dataset.k=c+1; probe.hidden=true; const i=document.createElement('i'); i.className='sk'; probe.append(i); document.getElementById('scrGame').append(probe); const bg=getComputedStyle(i).backgroundImage; probe.remove(); return bg; }
const skEl = () => Object.assign(document.createElement('i'),{className:'sk'});
function tileEl(k, cls){ const b=document.createElement('div'); b.className='blk'+(cls?' '+cls:''); b.dataset.k=k; b.style.setProperty('--c',`var(--k${k})`); b.append(skEl()); return b; }
const kindTile = kind => tileEl(kindSlots[kind % kindSlots.length]+1);

const BOW = '<svg viewBox="0 0 54 34"><path d="M27 16C20 4 4 2 5 13s16 10 22 3zm0 0c7-12 23-14 22-3s-16 10-22 3z" fill="#ff7aa8" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 18l-6 14M30 18l6 14" stroke="#ff7aa8" stroke-width="5" stroke-linecap="round"/><path d="M24 18l-6 14M30 18l6 14" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".6"/><circle cx="27" cy="16" r="5.5" fill="#ff4f86" stroke="#fff" stroke-width="2"/><path d="M12 9c3-1 6 0 8 3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/></svg>';

function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- rules ---------- */
const CAP = 4;
const top = t => t.length ? t[t.length-1] : -1;
function runLen(t){ if (!t.length) return 0; let k=1; while (k<t.length && t[t.length-1-k]===top(t)) k++; return k; }
const isDone = t => t.length===CAP && t.every(x=>x===t[0]);
function canPour(tubes, i, j){
  if (i===j) return false; const a=tubes[i], b=tubes[j];
  if (!a.length || isDone(a) || b.length>=CAP) return false;
  return true;                                          // any jar with room takes a pour
}
function pourCount(tubes,i,j){ return Math.min(runLen(tubes[i]), CAP-tubes[j].length); }

/* ---------- solver (depth-first, memoised) ---------- */
function solve(start, limit=150000){
  const seen=new Set(); let nodes=0;
  const key = ts => ts.map(t=>t.join('')).sort().join('|');
  function done(ts){ return ts.every(t=>!t.length || isDone(t)); }
  function dfs(ts){
    if (done(ts)) return true;
    if (++nodes>limit) return false;
    const k=key(ts); if (seen.has(k)) return false; seen.add(k);
    const moves=[];
    for (let i=0;i<ts.length;i++){
      const a=ts[i]; if (!a.length || isDone(a)) continue;
      const uniform = a.every(x=>x===a[0]);
      let triedEmpty=false;
      for (let j=0;j<ts.length;j++){
        if (!canPour(ts,i,j)) continue;
        const b=ts[j];
        if (!b.length){ if (uniform || triedEmpty) continue; triedEmpty=true; moves.push([1,i,j]); }
        else moves.push([top(b)===top(a) ? 0 : 2, i, j]);
      }
    }
    moves.sort((x,y)=>x[0]-y[0]);
    for (const [,i,j] of moves){
      const n=pourCount(ts,i,j), nt=ts.map(t=>t.slice());
      for (let q=0;q<n;q++) nt[j].push(nt[i].pop());
      if (dfs(nt)) return true;
    }
    return false;
  }
  return dfs(start.map(t=>t.slice()));
}

/* ---------- levels ---------- */
function levelSpec(n){
  const want = Math.min(8, 5 + Math.floor((n-1)/4));         // kinds: 5 at level 1, up to 8
  const K = Math.max(3, Math.min(want, kindSlots.length));
  const empty = 1;                                      // pours go anywhere, so one spare jar keeps it tricky
  const mystery = n>=2;
  return {K, empty, mystery};
}
function genLevel(n){
  const sp = levelSpec(n);
  for (let attempt=0; attempt<200; attempt++){
    const R = rng(n*7919 + attempt*31 + sp.K*101);
    const bag=[]; for (let k=0;k<sp.K;k++) for (let q=0;q<CAP;q++) bag.push(k);
    for (let i=bag.length-1;i>0;i--){ const j=Math.floor(R()*(i+1)); [bag[i],bag[j]]=[bag[j],bag[i]]; }
    const tubes=[]; for (let k=0;k<sp.K;k++) tubes.push(bag.slice(k*CAP,(k+1)*CAP));
    if (tubes.some(t=>runLen(t)>=3)) continue;               // no near-finished jars at the start
    for (let e=0;e<sp.empty;e++) tubes.push([]);
    if (!solve(tubes)) continue;
    // mystery: everything below the top tile starts hidden (later levels hide more jars)
    const hidden = tubes.map(t=>t.map((_,i)=>sp.mystery && i<t.length-1 && R() < Math.min(.9, .45 + n*.02)));
    return {n, tubes, hidden, K:sp.K};
  }
  return null;
}

/* ---------- level setup + layout ---------- */

  $('lvlTxt').textContent=`LEVEL ${n}`; $('movesTxt').textContent='0';

  show('game'); build(); updateBoosts();
}
let rows=[];
function layout(){
  const N=G.tubes.length, r=stage.getBoundingClientRect();
  const perRow = N<=5 ? N : Math.ceil(N/2);
  rows = []; for (let i=0;i<N;i+=perRow) rows.push([...Array(Math.min(perRow,N-i)).keys()].map(k=>k+i));
  const availW=Math.min(r.width,460), availH=Math.max(260,r.height-10);
  const gapX=.42, padX=.5, jarH=CAP+.55, rowGap=1.25;
  const byW = availW/(perRow*1.16 + (perRow-1)*gapX + 2*padX + .5);
  const byH = availH/(rows.length*jarH + (rows.length-1)*rowGap + 1.2);
  T = Math.floor(Math.max(30, Math.min(64, byW, byH)));
  return {perRow, gapX, padX, jarH, rowGap};
}
function build(){
  const {perRow,gapX,padX,jarH,rowGap} = layout();
  board.innerHTML=''; jarEls.length=0;
  const jarW = T*1.16, gx=T*gapX, rowW = perRow*jarW + (perRow-1)*gx + 2*T*padX;
  const rowH = T*jarH;
  board.style.width=rowW+'px'; board.style.height=(rows.length*rowH + (rows.length-1)*T*rowGap + T*.5)+'px';
  rows.forEach((ids,ri)=>{
    const y0 = ri*(rowH + T*rowGap) + T*.35, w = ids.length*jarW + (ids.length-1)*gx, x0=(rowW-w)/2;
    const sh=document.createElement('div'); sh.className='shelf'; sh.style.cssText=`left:${x0-T*.45}px;width:${w+T*.9}px;top:${y0+rowH-T*.12}px;height:${T*.42}px`; board.append(sh);
    ids.forEach((id,k)=>{
      const j=document.createElement('div'); j.className='jar'; j.dataset.i=id;
      j.style.cssText=`left:${x0+k*(jarW+gx)}px;top:${y0}px;width:${jarW}px;height:${rowH}px`;
      j.innerHTML=`<div class="glass"></div><div class="lip"></div><div class="bow">${BOW}</div>`;
      j.addEventListener('pointerdown', e=>{ e.preventDefault(); tapJar(id); });
      board.append(j); jarEls[id]=j;

}
function slotPos(j, idx){ const pad=(T*1.16-T*.92)/2; return {x:pad, y:T*(CAP+.55) - T*.18 - (idx+1)*T*.96, s:T*.92}; }
function renderJar(i){
  const j=jarEls[i]; j.querySelectorAll('.tw').forEach(e=>e.remove());
  const t=G.tubes[i], h=G.hidden[i];
  t.forEach((kind,idx)=>{
    const p=slotPos(j,idx), w=document.createElement('div'); w.className='tw'; w.dataset.idx=idx;
    w.style.cssText=`left:${p.x}px;top:${p.y}px;width:${p.s}px;height:${p.s}px;z-index:${2+idx}`;
    w.append(kindTile(kind));
    if (h[idx]){ const m=document.createElement('div'); m.className='mys'; m.style.fontSize=(T*.5)+'px'; m.textContent='?'; w.append(m); }
    j.append(w);
  });
  j.classList.toggle('done', isDone(t));
  j.classList.toggle('sel', sel===i);
  if (sel===i) liftTop(i, true);
}
function liftTop(i, on){
  const t=G.tubes[i], n=runVisible(i), els=[...jarEls[i].querySelectorAll('.tw')];
  els.forEach(e=>{ const idx=+e.dataset.idx; e.style.transform = on && idx>=t.length-n ? `translateY(${-T*.55}px)` : ''; });
}
function runVisible(i){ const t=G.tubes[i], h=G.hidden[i]; if (!t.length) return 0; let k=1; while (k<t.length && t[t.length-1-k]===top(t) && !h[t.length-1-k]) k++; return k; }

/* ---------- play ---------- */
function tapJar(i){
  if (done || busy || screen!=='game' || !pauseEl.hidden || !overEl.hidden) return;
  const t=G.tubes[i];
  if (sel===-1){
    if (!t.length || isDone(t)){ shake(i); return; }
    sel=i; jarEls[i].classList.add('sel'); liftTop(i,true); sfx('pick'); buzz(5); return;
  }
  if (sel===i){ jarEls[i].classList.remove('sel'); liftTop(i,false); sel=-1; sfx('drop'); return; }
  const from=sel;
  if (!canPourVisible(from,i)){
    // tapping another full-able jar switches the selection
    jarEls[from].classList.remove('sel'); liftTop(from,false); sel=-1;
    if (t.length && !isDone(t)){ sel=i; jarEls[i].classList.add('sel'); liftTop(i,true); sfx('pick'); }
    else shake(i);
    return;
  }
  pour(from,i);
}
function canPourVisible(i,j){ return canPour(G.tubes,i,j); }
function shake(i){ const j=jarEls[i]; j.classList.remove('shake'); void j.offsetWidth; j.classList.add('shake'); sfx('bump'); buzz(8); }
function pour(i,j){
  const n = Math.min(runLen(G.tubes[i]), CAP-G.tubes[j].length);
  undoStack.push({tubes:G.tubes.map(t=>t.slice()), hidden:G.hidden.map(h=>h.slice()), moves});
  busy=true; sel=-1; jarEls[i].classList.remove('sel');
  const srcEls=[...jarEls[i].querySelectorAll('.tw')].slice(-n).reverse();
  const srcJar=jarEls[i], sr=srcJar.getBoundingClientRect(), jr=jarEls[j].getBoundingClientRect();
  const kind=top(G.tubes[i]), dir = jr.left+jr.width/2 >= sr.left+sr.width/2 ? 1 : -1;
  // lift the jar so its mouth sits just above the target's mouth, tipped toward it
  // the mouth is the top centre of the jar; after rotating by θ about its centre it sits at centre + (h/2·sinθ, −h/2·cosθ)
  const th = 100*Math.PI/180, h2 = sr.height/2;
  const mouthX = jr.left + jr.width/2, mouthY = jr.top - T*.7;
  const cx = mouthX - dir*h2*Math.sin(th), cy = mouthY + h2*Math.cos(th);
  const dx = cx - (sr.left + sr.width/2), dy = cy - (sr.top + h2);
  srcJar.style.zIndex=20;
  const tilt = srcJar.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${dx}px,${dy}px) rotate(${dir*80}deg)`,offset:.55},{transform:`translate(${dx}px,${dy}px) rotate(${dir*100}deg)`}],
    {duration:300, easing:'cubic-bezier(.4,0,.2,1)', fill:'forwards'});
  sfx('swish');
  const flights = srcEls.map((el,q)=>new Promise(res=>{
    setTimeout(()=>{
      const r=el.getBoundingClientRect(), f=document.createElement('div'); f.className='fly'; f.dataset.skin=skin;
      f.style.width=T*.92+'px'; f.style.height=T*.92+'px'; f.append(kindTile(kind)); document.body.append(f);
      el.style.visibility='hidden';
      const dst=slotPos(jarEls[j], G.tubes[j].length+q), x1=jr.left+dst.x, y1=jr.top+dst.y;
      const x0=r.left+r.width/2-T*.46, y0=r.top+r.height/2-T*.46;
      const spin = dir*(300+Math.random()*120);
      const a=f.animate([
        {transform:`translate(${x0}px,${y0}px) rotate(${dir*90}deg)`},
        {transform:`translate(${x1}px,${jr.top-T*.6}px) rotate(${spin*.45}deg)`, offset:.35, easing:'cubic-bezier(.5,0,.9,.5)'},
        {transform:`translate(${x1}px,${y1+T*.05}px) rotate(${spin}deg) scale(1.04,.94)`, offset:.82},
        {transform:`translate(${x1}px,${y1-T*.12}px) rotate(${spin}deg) scale(.98,1.03)`, offset:.91},
        {transform:`translate(${x1}px,${y1}px) rotate(${Math.round(spin/360)*360}deg)`}
      ], {duration:520, easing:'linear', fill:'forwards'});
      a.finished.then(()=>{ f.remove(); sfx('plop', q); buzz(4); res(); });
    }, 230 + q*120);
  }));
  Promise.all(flights).then(()=>{
    const back = srcJar.animate([{transform:`translate(${dx}px,${dy}px) rotate(${dir*100}deg)`},{transform:'translate(0,0) rotate(0)'}],{duration:260, easing:'cubic-bezier(.3,1.3,.5,1)'});
    tilt.cancel(); back.finished.then(()=>{ srcJar.style.zIndex=''; });
  });
  Promise.all(flights).then(()=>{
    for (let q=0;q<n;q++){ G.tubes[j].push(G.tubes[i].pop()); G.hidden[j].push(false); G.hidden[i].pop(); }
    moves++; $('movesTxt').textContent=moves;
    const revealAt = G.tubes[i].length-1, reveals = revealAt>=0 && G.hidden[i][revealAt];
    renderJar(i); renderJar(j);
    if (reveals){ const m=jarEls[i].querySelector(`.tw[data-idx="${revealAt}"] .mys`); G.hidden[i][revealAt]=false; if (m){ m.classList.add('reveal'); setTimeout(()=>m.remove(),460); } sfx('reveal'); }
    buzz(8);
    busy=false;
    if (isDone(G.tubes[j])) completed(j);
    checkEnd();
  });
}
let streak=0, streakT=null;
function completed(j){
  const jr=jarEls[j].getBoundingClientRect(), sr=stage.getBoundingClientRect();
  burstAt(jr.left-sr.left+jr.width/2, jr.top-sr.top+T*.6, realColor(kindSlots[G.tubes[j][0] % kindSlots.length]), 18);
  streak++; clearTimeout(streakT); streakT=setTimeout(()=>streak=0,4000);
  sfx('done', streak); buzz([14,40,14]);
  if (streak===2) banner('Sweet!'); else if (streak===3) banner('Amazing!'); else if (streak>=4) banner('On fire!');
}
function legalMoves(){ const ts=G.tubes; for (let i=0;i<ts.length;i++) for (let j=0;j<ts.length;j++) if (canPour(ts,i,j) && !(ts[i].every(x=>x===ts[i][0]) && !ts[j].length)) return true; return false; }
function checkEnd(){

}

/* ---------- sound + haptics ---------- */
let ac=null;
function tone(f,t,dur,type,vol){ const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02); }
function sfx(kind,n){
  if (!soundOn) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if (ac.state==='suspended') ac.resume();
    const t=ac.currentTime;
    if (kind==='pick') tone(620,t,.06,'sine',.06);
    if (kind==='drop') tone(420,t,.06,'sine',.05);
    if (kind==='swish'){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(640,t+.18); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.04,t+.03); g.gain.exponentialRampToValueAtTime(.0001,t+.2); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+.22); }
    if (kind==='plop') tone(520+(n||0)*90,t,.07,'triangle',.07);
    if (kind==='reveal'){ tone(990,t,.08,'sine',.05); tone(1320,t+.06,.1,'sine',.04); }
    if (kind==='bump') tone(140,t,.08,'sine',.08);
    if (kind==='done'){ const b=523.25*Math.pow(2,Math.min(n||0,8)/12); [0,4,7,12].forEach((s,k)=>tone(b*Math.pow(2,s/12),t+k*.06,.22,'triangle',.11)); }
    if (kind==='win') [523.25,659.25,783.99,1046.5,1318.5].forEach((f,k)=>tone(f,t+k*.09,.35,'triangle',.12));
    if (kind==='over') [392,330,262,196].forEach((f,k)=>tone(f,t+k*.14,.3,'sine',.12));
  }catch(e){}
}
function buzz(p){ if (!hapticsOn) return; try{ navigator.vibrate && navigator.vibrate(p); }catch(e){} }

/* ---------- effects ---------- */
function burstAt(x,y,color,count){

    const d=document.createElement('div'); d.className='pt'; const s=T*(.22+Math.random()*.2);
    d.style.cssText=`width:${s}px;height:${s}px;left:${x-s/2}px;top:${y-s/2}px;background:${color}`;
    fxEl.append(d);

    const a=d.animate([{transform:'translate(0,0) rotate(0) scale(1)',opacity:1},{transform:`translate(${Math.cos(ang)*dist}px,${Math.sin(ang)*dist-T*.4}px) rotate(${Math.random()*540}deg) scale(.3)`,opacity:0}],{duration:650+Math.random()*350,easing:'cubic-bezier(.2,.7,.4,1)'});
    a.onfinish=()=>d.remove();

}

function confetti(host){
  const cols=kindSlots.map(realColor); for (let k=0;k<44;k++){ const c=document.createElement('div'); c.className='conf'; c.style.left=(Math.random()*100)+'%'; c.style.background=cols[k%cols.length];
    c.style.setProperty('--dx',(Math.random()*120-60)+'px'); c.style.setProperty('--rot',(Math.random()*900-450)+'deg'); c.style.setProperty('--t',(1.6+Math.random()*1.4)+'s'); c.style.setProperty('--dl',(Math.random()*.5)+'s'); host.append(c); setTimeout(()=>c.remove(),3600); }
}

/* ---------- modals ---------- */
function closeModal(el){ el.hidden=true; el.innerHTML=''; }
function showModal(el,o,actions){
  el.innerHTML=`${o.rays?'<div class="rays"></div>':''}<div class="panel mpanel${o.rays?' wide-ribbon':''}"><div class="ribbon ${o.color||''}"><span class="ot">${o.ribbon}</span></div>${o.corner||''}${o.body||''}<div class="mbtns">${
    o.buttons.map(b=>`<button class="gbtn ${b.color||''} ${b.small?'sm':''}" data-act="${b.act}" type="button"><span class="${b.color==='cream'?'':'ot'}">${b.label}</span></button>`).join('')}</div></div>`;
  el.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>actions[b.dataset.act]()));
  el.hidden=false;
}
function openPause(){
  if (done) return;
  const snd = soundOn ? '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>' : '<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const hap = hapticsOn ? '<svg viewBox="0 0 24 24" fill="#fff"><rect x="8" y="3.5" width="8" height="17" rx="2.2"/><path d="M4.5 8.5l-1.5 1.8 1.5 1.7-1.5 1.8 1.5 1.7M19.5 8.5l1.5 1.8-1.5 1.7 1.5 1.8-1.5 1.7" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '<svg viewBox="0 0 24 24" fill="#fff"><rect x="8" y="3.5" width="8" height="17" rx="2.2"/><path d="M4 5l16 14" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  showModal(pauseEl,{ribbon:'Paused',color:'blue',
    corner:`<div class="corners"><button class="ibtn ${hapticsOn?'':'orange'} corner" data-act="hap" type="button" aria-label="Vibration ${hapticsOn?'on':'off'}">${hap}</button><button class="ibtn ${soundOn?'':'orange'} corner" data-act="snd" type="button" aria-label="Sound ${soundOn?'on':'off'}">${snd}</button></div>`,
    body:`<p>Level ${G.n} · ${moves} moves</p>`,
    buttons:[{label:'Resume',act:'resume'},{label:'Restart Level',act:'restart',color:'cream',small:true},{label:'Tile Styles',act:'styles',color:'cream',small:true},{label:'Home',act:'home',color:'cream',small:true}]},
    {resume:()=>closeModal(pauseEl),
     restart:()=>startLevel(G.n),
     styles:()=>{ closeModal(pauseEl); stylesReturn='game'; show('styles'); },
     home:()=>{ closeModal(pauseEl); show('home'); },
     snd:()=>{ soundOn=!soundOn; store.set(K_SND,soundOn?'1':'0'); openPause(); },
     hap:()=>{ hapticsOn=!hapticsOn; store.set(K_HAP,hapticsOn?'1':'0'); openPause(); buzz(15); }});
}
$('pauseBtn').addEventListener('click', openPause);
$('goPlay').addEventListener('click', ()=>startLevel(level));
$('goStyles').addEventListener('click', ()=>{ stylesReturn='home'; show('styles'); });
$('stylesBack').addEventListener('click', ()=>{
  if (stylesReturn==='game' && G){
    if (kindSlots.length < Math.min(G.K, 8) && G.K > kindSlots.length){ startLevel(G.n); return; }   // style has fewer looks than this level needs
    show('game'); build();
  } else show('home');
});

function win(){
  if (done) return; done=true;
  const got = 3 - (extraUsed?1:0) - (undosUsed>3?1:0);
  stars[G.n] = Math.max(stars[G.n]||0, got); store.set(K_STARS, JSON.stringify(stars));
  if (G.n>=level){ level=G.n+1; store.set(K_LVL,String(level)); }
  sfx('win'); buzz([15,40,15,40,30]);
  showModal(overEl,{rays:true,ribbon:'All Sorted!',color:'green',
    body:`<div class="stars3" aria-label="${got} of 3 stars">${ICON_STAR(got>=1)}${ICON_STAR(got>=2)}${ICON_STAR(got>=3)}</div><p>Level ${G.n} in ${moves} moves</p>`,
    buttons:[{label:'Next Level',act:'next'},{label:'Home',act:'home',color:'cream',small:true}]},
    {next:()=>startLevel(G.n+1), home:()=>{ closeModal(overEl); show('home'); }});
  confetti(overEl);
}
function stuck(){
  if (done || legalMoves()) return;
  sfx('over'); buzz([20,60,20]);
  const btns=[{label:'Undo',act:'undo'}];
  if (extraJars>0) btns.push({label:'Add a Jar',act:'jar',color:'cream',small:true});
  btns.push({label:'Restart',act:'retry',color:'cream',small:true});
  showModal(overEl,{ribbon:'No Moves Left',color:'red',body:'<p>Every jar is blocked. Undo a pour or add an empty jar.</p>',buttons:btns},
    {undo:()=>{ closeModal(overEl); $('undoBtn').click(); },
     jar:()=>{ closeModal(overEl); $('jarBtn').click(); },
     retry:()=>startLevel(G.n)});
}

let rT=null;
window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if (screen==='game' && G) build(); },150); });

window.__bs = {genLevel, solve, get G(){return G;}, startLevel, get kindSlots(){return kindSlots;}, tapJar};
applySkin();
show('home');
})();
</script>

<script>
if ('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
